name: Deploy Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trackademy_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d trackademy_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/trackademy_ci
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_OIDC_TENANT_ENABLED: "false"
      APP_AUTH_MICROSOFT_FRONTEND_CLIENT_ID: ci-microsoft-client-id
      APP_AUTH_GOOGLE_FRONTEND_CLIENT_ID: ci-google-client-id
      APP_AUTH_JWT_SECRET: trackademy-ci-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TRACKADEMY_VPS_HOST }}
          username: ${{ secrets.TRACKADEMY_VPS_USER }}
          key: ${{ secrets.TRACKADEMY_VPS_SSH_KEY }}
          script: |
            cd /opt/trackademy/trackademy-backend
            chmod +x ops/deploy-prod.sh
            ./ops/deploy-prod.sh main
