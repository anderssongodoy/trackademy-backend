name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TRACKADEMY_VPS_HOST }}
          username: ${{ secrets.TRACKADEMY_VPS_USER }}
          key: ${{ secrets.TRACKADEMY_VPS_SSH_KEY }}
          script: |
            cd /opt/trackademy/trackademy-backend
            chmod +x ops/deploy-prod.sh
            ./ops/deploy-prod.sh main
