services:
  trackademy-backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: trackademy-backend:prod
    container_name: trackademy-backend
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080
    network_mode: host
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
