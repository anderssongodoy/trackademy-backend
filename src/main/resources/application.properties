# =========================================================
# Trackademy Backend
# =========================================================
# Defaults aqui solo cubren desarrollo local.
# Valores sensibles y de produccion vienen siempre por env vars (.env / .env.prod).

# ----- Runtime -----
app.environment=${APP_ENVIRONMENT:local}

# ----- HTTP / CORS -----
# Local solo permite el frontend Angular en localhost. En prod se sobrescribe con la URL real.
quarkus.http.cors=${QUARKUS_HTTP_CORS:true}
quarkus.http.cors.origins=${QUARKUS_HTTP_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
quarkus.http.cors.methods=${QUARKUS_HTTP_CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}
quarkus.http.cors.headers=${QUARKUS_HTTP_CORS_HEADERS:accept,authorization,content-type,x-requested-with}
quarkus.http.cors.access-control-allow-credentials=${QUARKUS_HTTP_CORS_ALLOW_CREDENTIALS:true}
quarkus.http.limits.max-body-size=${QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE:50M}

# ----- Datasource -----
# Usuario y password requeridos por env. Sin defaults para forzar configuracion explicita.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/trackademy_bd}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:}

# ----- ORM / Flyway -----
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.jackson.write-dates-as-timestamps=false
quarkus.flyway.migrate-at-start=${QUARKUS_FLYWAY_MIGRATE_AT_START:false}
quarkus.flyway.repair-at-start=true
quarkus.swagger-ui.always-include=true

# ----- OIDC -----
# Desactivado: la autenticacion del producto usa validacion de id_token de Google/Microsoft + JWT propio.
quarkus.oidc.tenant-enabled=${QUARKUS_OIDC_TENANT_ENABLED:false}
quarkus.oidc.application-type=${QUARKUS_OIDC_APPLICATION_TYPE:service}
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:}
quarkus.oidc.token.audience=${QUARKUS_OIDC_TOKEN_AUDIENCE:}

# ----- Auth: Microsoft -----
app.auth.microsoft.frontend-client-id=${APP_AUTH_MICROSOFT_FRONTEND_CLIENT_ID:}
app.auth.microsoft.jwks-uri=${APP_AUTH_MICROSOFT_JWKS_URI:https://login.microsoftonline.com/common/discovery/v2.0/keys}
app.auth.microsoft.issuer-prefix=${APP_AUTH_MICROSOFT_ISSUER_PREFIX:https://login.microsoftonline.com/}

# ----- Auth: Google -----
app.auth.google.frontend-client-id=${APP_AUTH_GOOGLE_FRONTEND_CLIENT_ID:}
app.auth.google.jwks-uri=${APP_AUTH_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
app.auth.google.client-secret=${APP_AUTH_GOOGLE_CLIENT_SECRET:}
app.auth.google.redirect-uri=${APP_AUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
app.auth.google.authorization-uri=${APP_AUTH_GOOGLE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
app.auth.google.token-uri=${APP_AUTH_GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}

# ----- App JWT -----
# Default local conocido: ProductionConfigValidator rechaza arrancar en prod con este valor.
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:trackademy-local-dev-secret-change-me}
app.auth.jwt.issuer=${APP_AUTH_JWT_ISSUER:trackademy}
app.auth.jwt.ttl-seconds=${APP_AUTH_JWT_TTL_SECONDS:28800}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:4200}

# ----- WhatsApp / Meta Cloud API -----
# Si enabled=true en prod, el validator exige todas las APP_WHATSAPP_* configuradas.
app.whatsapp.enabled=${APP_WHATSAPP_ENABLED:false}
app.whatsapp.meta.access-token=${APP_WHATSAPP_META_ACCESS_TOKEN:}
app.whatsapp.meta.phone-number-id=${APP_WHATSAPP_META_PHONE_NUMBER_ID:}
app.whatsapp.meta.webhook-verify-token=${APP_WHATSAPP_META_WEBHOOK_VERIFY_TOKEN:}
app.whatsapp.meta.app-secret=${APP_WHATSAPP_META_APP_SECRET:}
app.whatsapp.meta.api-version=${APP_WHATSAPP_META_API_VERSION:v23.0}
app.whatsapp.official-number=${APP_WHATSAPP_OFFICIAL_NUMBER:}
app.whatsapp.link-code.ttl-seconds=${APP_WHATSAPP_LINK_CODE_TTL_SECONDS:600}

# ----- Anthropic (analisis IA de silabos) -----
# Vacio desactiva el analisis (SilaboAnalysisService falla rapido si esta vacio).
app.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}

# ----- Mailer (SMTP) -----
# Configurar por env. Sin defaults para no acoplar a un proveedor especifico.
quarkus.mailer.from=${QUARKUS_MAILER_FROM:}
quarkus.mailer.host=${QUARKUS_MAILER_HOST:}
quarkus.mailer.port=${QUARKUS_MAILER_PORT:587}
quarkus.mailer.start-tls=${QUARKUS_MAILER_START_TLS:REQUIRED}
quarkus.mailer.ssl=${QUARKUS_MAILER_SSL:false}
quarkus.mailer.auth-methods=${QUARKUS_MAILER_AUTH_METHODS:BASIC}
quarkus.mailer.username=${QUARKUS_MAILER_USERNAME:}
quarkus.mailer.password=${QUARKUS_MAILER_PASSWORD:}
quarkus.mailer.trust-all=${QUARKUS_MAILER_TRUST_ALL:false}
quarkus.mailer.mock=${QUARKUS_MAILER_MOCK:false}

# ----- Feedback -----
# Destinatario de los reportes generados desde el frontend.
app.feedback.email.destino=${APP_FEEDBACK_EMAIL_DESTINO:}

# ----- Image upload (ImgBB) -----
app.upload.imgbb.api-key=${APP_UPLOAD_IMGBB_API_KEY:}
